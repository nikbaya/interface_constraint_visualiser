<!doctype html>
<!-- Source for the social-preview image (assets/og-preview.png).
     Renders a real 3D complex with its inter-subunit interface in orange.
     Must be served over http (3Dmol fetches the PDB), then screenshot at
     1200x630 with headless Chrome + WebGL flags:
       python3 -m http.server 8140 &
       chrome --headless=new --enable-unsafe-swiftshader --ignore-gpu-blocklist \
         --hide-scrollbars --window-size=1200,630 --virtual-time-budget=9000 \
         --screenshot=assets/og-preview.png http://localhost:8140/assets/og.html
     Not linked as a page; purely the OG-image template. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1a1a1a; background: #ffffff; overflow: hidden; position: relative;
  }
  .text { position: absolute; left: 80px; top: 72px; width: 560px; height: 486px;
    display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 700; }
  .brand .dot { width: 22px; height: 22px; border-radius: 50%; background: #F36C3E; }
  h1 { font-size: 60px; line-height: 1.08; letter-spacing: -.02em; max-width: 15ch; margin-top: 8px; }
  h1 em { color: #F36C3E; font-style: normal; }
  .lede { font-size: 25px; color: #33373b; max-width: 42ch; margin-top: 20px; }
  .foot { font-size: 21px; color: #63666A; }
  .foot .o { color: #F36C3E; font-weight: 600; }
  #viz { position: absolute; right: 18px; top: 35px; width: 480px; height: 560px; }
</style>
</head>
<body>
  <div class="text">
    <div>
      <div class="brand"><span class="dot"></span> Interface Constraint Visualiser</div>
      <h1>Are protein <em>interface</em> residues more constrained?</h1>
      <p class="lede">Missense depletion and ClinVar pathogenic variants at
        protein&ndash;protein interfaces, residue by residue.</p>
    </div>
    <p class="foot"><span class="o">Orange</span> = inter-subunit interface &middot;
      gnomAD v4.1 &times; Genomics2Proteins</p>
  </div>
  <div id="viz"></div>

  <script src="https://cdn.jsdelivr.net/npm/3dmol@2.4.2/build/3Dmol-min.js"></script>
  <script>
    const CHAIN_TINTS = ["#DCEEC8", "#E6DAF2", "#FBD3D8"];  // pale subunit colours
    const INTERFACE = "#F36C3E";                            // Broad orange
    const CHAINS = ["A", "B"];                              // TIM homodimer (clear interface plane)
    (async () => {
      const data = await (await fetch("1hti.pdb")).text();
      const v = window.$3Dmol.createViewer(document.getElementById("viz"),
        { backgroundColor: "white", antialias: true });
      v.addModel(data, "pdb");
      CHAINS.forEach((ch, i) =>
        v.setStyle({ chain: ch }, { cartoon: { color: CHAIN_TINTS[i % CHAIN_TINTS.length] } }));
      CHAINS.forEach((ch) =>
        v.addStyle({ chain: ch, byres: true, within: { distance: 4.0, sel: { chain: CHAINS.filter((c) => c !== ch) } } },
          { cartoon: { color: INTERFACE } }));
      // Orient the two-fold interface plane toward the camera, then fit.
      v.rotate(90, "y");
      v.zoomTo();
      v.zoom(0.95);
      v.render();
      window.__ready = true;   // screenshot signal
    })();
  </script>
</body>
</html>
